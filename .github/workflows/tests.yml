name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regeln:
    name: Regeln und Computerspieler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test 'tests/*.test.js'
