  <style>
    :root {
      --bg: #0c0e13;
      --flaeche: #161a22;
      --flaeche-2: #1c212b;
      --text: #eceef3;
      --muted: #8b93a7;
      --accent: #fe7971;
      --linie: rgba(255, 255, 255, 0.08);
      --max: 640px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(120% 50% at 0% 0%, rgba(254, 121, 113, 0.14), transparent 60%), var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    a, button { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .app {
      width: min(100%, var(--max)); margin: 0 auto;
      min-height: 100vh; min-height: 100dvh;
      padding: calc(18px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex; flex-direction: column; gap: 22px;
    }
    .kopf { display: flex; align-items: center; gap: 10px; }
    .kopf .logo { width: 44px; height: 25px; display: block; }
    .kopf .wort { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.01em; }
    .rund {
      margin-left: auto; width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center; text-decoration: none; font-size: 17px;
      background: var(--flaeche); border: 1px solid var(--linie);
    }
    .rund + .rund { margin-left: 0; }
    .weiter {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 14px 14px 16px; border-radius: 20px;
      background: linear-gradient(135deg, #1b1f29, #12151c); border: 1px solid var(--linie);
    }
    .weiter .los { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
    .weiter .los b { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 19px; display: flex; align-items: center; gap: 8px; }
    .weiter .los b::before { content: ""; width: 0; height: 0; border-left: 11px solid var(--accent); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
    .weiter .los span { color: var(--muted); font-size: 13.5px; }
    .weiter .ende {
      border: 1px solid var(--linie); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
    }
    .weiter .ende.sicher { border-color: var(--accent); color: var(--accent); }
    .gruppe { display: flex; flex-direction: column; gap: 10px; }
    .gruppe h2 { margin: 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kachel {
      display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
      min-height: 104px; padding: 14px; border-radius: 18px;
      background: var(--flaeche); border: 1px solid var(--linie);
      text-decoration: none; text-align: left;
      transition: transform .08s ease, border-color .15s ease, background .15s ease;
    }
    .kachel:hover, .kachel:focus-visible { border-color: rgba(254, 121, 113, 0.45); outline: none; }
    .kachel:active { transform: scale(.98); }
    .kachel.haupt { background: linear-gradient(160deg, rgba(254, 121, 113, 0.22), var(--flaeche) 62%); border-color: rgba(254, 121, 113, 0.35); }
    .kachel svg { width: 28px; height: 28px; color: var(--accent); }
    /* breite Kachel mit Auswahl direkt darin (Jass Training, Zähler) */
    .kachel.breit { grid-column: 1 / -1; cursor: default; gap: 12px; }
    .kachel.breit:active { transform: none; }
    .kachel.breit .titel { display: flex; align-items: center; gap: 10px; }
    .kachel.breit .wahl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
    .kachel.breit .wahl a {
      display: grid; place-items: center; min-height: 46px; padding: 8px 6px; border-radius: 12px; text-align: center;
      text-decoration: none; color: inherit; font-weight: 700; font-size: 14px; line-height: 1.2;
      background: color-mix(in srgb, currentColor 7%, transparent); border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
    }
    .kachel.breit .wahl a:hover, .kachel.breit .wahl a:focus-visible { border-color: var(--accent); outline: none; }
    .kachel.breit .wahl a:active { transform: scale(.97); }
    .kachel b { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 17px; font-weight: 700; line-height: 1.15; }
    /* Quick Trumpf: neun Karten, was trumpfst du? */
    .quick { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; background: var(--flaeche); border: 1px solid var(--linie); }
    .quick-kopf { display: flex; align-items: center; gap: 8px; }
    .quick-kopf b { font-family: "Space Grotesk", "Inter", sans-serif; font-size: 17px; }
    .quick-kopf .weg { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--linie); background: transparent; color: var(--muted); font-size: 14px; }
    .quick-karten { display: flex; padding: 2px 0; }
    .quick-karten .karte { flex: 0 0 calc(100% / 5.96); filter: drop-shadow(-2px 0 3px rgba(0, 0, 0, .35)); }
    .quick-karten .karte + .karte { margin-left: calc(-100% / 5.96 * 0.38); }
    .quick-karten .karte svg { display: block; width: 100%; height: auto; }
    .quick-wahl { display: flex; flex-direction: column; gap: 6px; }
    .quick-wahl .zeile { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px; }
    .quick-wahl button {
      min-height: 42px; border-radius: 12px; border: 2px solid var(--linie); background: #fffdf8; color: #111827;
      font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px;
    }
    .quick-wahl button .farbzeichen { width: 22px; height: 22px; }
    .quick-wahl button.schieben { background: var(--flaeche-2); color: var(--text); border-color: var(--linie); }
    .quick-wahl button:disabled { cursor: default; opacity: .45; }
    .quick-wahl button.meine { opacity: 1; border-color: #facc15; }
    .quick-wahl button.beste { opacity: 1; border-color: #4ade80; }
    .quick-ergebnis { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; line-height: 1.4; }
    .quick-ergebnis p { margin: 0; }
    .quick-ergebnis .klein { color: var(--muted); font-size: 13px; }
    .quick-knoepfe { display: flex; gap: 8px; }
    .quick-knoepfe > * {
      flex: 1; min-height: 40px; border-radius: 12px; display: grid; place-items: center; text-decoration: none; text-align: center;
      font-weight: 700; font-size: 14px; white-space: nowrap; padding: 0 6px; border: 1px solid var(--linie); background: transparent; color: var(--text);
    }
    .quick-knoepfe .nochmal { background: var(--accent); border-color: var(--accent); color: #1b0d0c; }
    .quick-balken { height: 6px; border-radius: 3px; background: var(--linie); overflow: hidden; }
    .quick-balken span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }
    .modal-hinten {
      position: fixed; inset: 0; z-index: 80; display: none; align-items: flex-end; justify-content: center;
      padding: 12px; background: rgba(5, 6, 9, 0.72);
    }
    .modal-hinten.offen { display: flex; }
    .modal {
      width: 100%; max-width: 480px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      border-radius: 22px; background: var(--flaeche); border: 1px solid var(--linie);
      display: flex; flex-direction: column; gap: 10px;
    }
    .modal-kopf { display: flex; align-items: center; justify-content: space-between; }
    .modal-kopf h2 { margin: 0; font-family: "Space Grotesk", "Inter", sans-serif; font-size: 20px; }
    .modal-kopf button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--linie); background: transparent; font-size: 18px; }
    .modus { display: block; padding: 15px 16px; border-radius: 14px; background: var(--flaeche-2); border: 1px solid var(--linie); text-decoration: none; font-weight: 700; font-size: 16px; }
    .modus:hover, .modus:focus-visible { border-color: rgba(254, 121, 113, 0.45); outline: none; }
    @media (min-width: 560px) { .modal-hinten { align-items: center; } }
  </style>
</head>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      // Laufendes Spiel gegen den Computer: weiterspielen oder beenden
      const KEY = 'jass-lernen-spiel-v1';
      function laufend() {
        try {
          const g = JSON.parse(localStorage.getItem(KEY) || 'null');
          if (!g || !g.spiel || g.spiel.fertig || g.spiel.version !== 1) return null;
          return g.spiel;
        } catch (e) { return null; }
      }
      const s = laufend();
      if (s) {
        const re = s.regeln || {};
        $('weiterText').textContent = re.spielende === 'punkte'
          ? 'Runde ' + (s.rundeNr + 1) + ' läuft · bis ' + re.zielPunkte
          : 'Runde ' + Math.min(s.rundeNr + 1, re.runden) + ' von ' + re.runden + ' läuft';
        $('weiter').hidden = false;
      }
      // Laufender Online-Tisch (jass-online.js merkt ihn sich, solange man sitzt)
      try {
        const t = JSON.parse(localStorage.getItem('jass-online-aktiv-v1') || 'null');
        if (t && /^[A-Z2-9]{6}$/.test(t.code) && Date.now() - (t.zeit || 0) < 24 * 3600 * 1000) {
          $('onlineLink').href = 'jass-online.html?t=' + t.code;
          $('onlineText').textContent = [t.name, t.stand].filter(Boolean).join(' · ');
          $('online').hidden = false;
        }
      } catch (e) { /* egal */ }
      let sicher = false;
      $('beenden').addEventListener('click', () => {
        const b = $('beenden');
        if (!sicher) { sicher = true; b.textContent = 'Wirklich?'; b.classList.add('sicher'); setTimeout(() => { sicher = false; b.textContent = 'Beenden'; b.classList.remove('sicher'); }, 3000); return; }
        try { localStorage.removeItem(KEY); } catch (e) { /* egal */ }
        $('weiter').hidden = true;
      });
    })();
  </script>
  <script src="jass-engine.js"></script>

  <script>
    // Quick Trumpf: neun zufällige Karten – was trumpfst du? Der Computer
    // rechnet schon, während man überlegt (gleich wie «Trumpf wählen»), und
    // zeigt nach der Antwort seine Wahl mit einem kurzen Grund. Abschalten
    // unter ⚙ (anzeige.quickTrumpf); «Ausblenden» gilt nur bis zum nächsten Besuch.
    (function () {
      const J = window.JassEngine, B = window.JassBot, K = window.JassKarten, E = window.JassEinstellungen;
      if (!J || !B || !K || !E) return;
      const $ = (id) => document.getElementById(id);
      const anzeige = E.ladeAnzeige();
      if (anzeige.quickTrumpf === false) return;
      const regeln = E.ladeRegeln();
      if (K.setzeBild) K.setzeBild(anzeige.kartenbild);
      if (K.setzeFarben) K.setzeFarben(anzeige.farben);
      const box = $('quick');
      const darfSchieben = !!regeln.schieben;
      const name = (c) => (c === 'SCHIEBEN' ? 'Schieben' : J.MODI[c].lang);
      const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      let hand = [], liste = null, wahl = null, rechnung = 0;

      function zeichneKarten(code) {
        const T = code && code !== 'SCHIEBEN' ? J.MODI[code].trumpf : -1;
        const c = code && code !== 'SCHIEBEN' ? code : null;
        $('quickKarten').innerHTML = J.sortiereHand(hand).map((k) => `<div class="karte">${K.svg(k, { trumpf: J.farbeVon(k) === T, code: c })}</div>`).join('');
      }
      function knopf(c) {
        if (c === 'SCHIEBEN') return `<button type="button" class="schieben" data-wahl="SCHIEBEN">↔ Schieben</button>`;
        const m = J.MODI[c];
        return m.trumpf >= 0
          ? `<button type="button" data-wahl="${c}" aria-label="${m.lang}">${K.zeichen(m.trumpf)}</button>`
          : `<button type="button" data-wahl="${c}">${m.symbol} ${m.name}</button>`;
      }
      function zeichneWahl() {
        const modi = J.erlaubteModi(regeln);
        const farben = modi.filter((c) => J.MODI[c].trumpf >= 0);
        const andere = modi.filter((c) => J.MODI[c].trumpf < 0).concat(darfSchieben ? ['SCHIEBEN'] : []);
        $('quickWahl').innerHTML = [farben, andere].filter((z) => z.length).map((z) => `<div class="zeile">${z.map(knopf).join('')}</div>`).join('');
      }
      function neu() {
        hand = J.verteile(J.zufall(J.neuerSeed()))[0];
        liste = null; wahl = null;
        zeichneKarten(null);
        zeichneWahl();
        $('quickErgebnis').hidden = true;
        $('quickKnoepfe').hidden = true;
        rechne();
      }
      // gleich wie «Trumpf wählen»: Rechentiefe aus den Einstellungen
      function rechne() {
        const id = ++rechnung;
        const b = B.bewertung(hand, regeln, { geschoben: !darfSchieben });
        const ziel = Math.max(200, B.rechentiefe(anzeige.rechnen).ansage * 4);
        const schritt = () => {
          if (id !== rechnung) return;
          const t0 = performance.now();
          while (b.gemacht < ziel && performance.now() - t0 < 25) b.schritt(5);
          if (b.gemacht < ziel) {
            const balken = $('quickBalken');
            if (balken) balken.style.width = Math.round((100 * b.gemacht) / ziel) + '%';
            setTimeout(schritt, 0);
            return;
          }
          liste = b.ergebnis();
          if (wahl) zeigeErgebnis();
        };
        setTimeout(schritt, 60);
      }
      function zeigeErgebnis() {
        const beste = liste[0];
        const meine = liste.find((x) => x.code === wahl) || beste;
        zeichneKarten(beste.code);
        $('quickWahl').querySelectorAll('button').forEach((b) => {
          b.disabled = true;
          b.classList.toggle('meine', b.dataset.wahl === wahl && wahl !== beste.code);
          b.classList.toggle('beste', b.dataset.wahl === beste.code);
        });
        const grund = esc(B.faustregel(hand, beste.code));
        const diff = beste.punkte - meine.punkte;
        // erwartete Punkte nur bei einer Ansage, nicht beim Schieben
        const punkte = (x) => (x.code === 'SCHIEBEN' ? '' : ` (Ø ${Math.round(x.punkte)} Punkte)`);
        $('quickErgebnis').innerHTML = meine === beste
          ? `<p><b>✓ Wie der Computer: ${esc(name(beste.code))}${punkte(beste)}.</b> ${grund}</p>`
          : `<p>Der Computer: <b>${esc(name(beste.code))}</b>${punkte(beste)}. ${grund}</p>
             <p class="klein">Deine Wahl, ${esc(name(meine.code))}${punkte(meine)}: ${diff < 1 ? 'praktisch gleich gut.' : 'im Schnitt ' + Math.round(diff) + ' Punkte weniger.'}</p>`;
        $('quickErgebnis').hidden = false;
        $('quickKnoepfe').hidden = false;
      }
      $('quickWahl').addEventListener('click', (e) => {
        const b = e.target.closest('[data-wahl]');
        if (!b || b.disabled || wahl) return;
        wahl = b.dataset.wahl;
        b.classList.add('meine');
        $('quickWahl').querySelectorAll('button').forEach((x) => { x.disabled = true; });
        if (liste) { zeigeErgebnis(); return; }
        $('quickErgebnis').innerHTML = '<p class="klein">Der Computer rechnet noch …</p><div class="quick-balken"><span id="quickBalken"></span></div>';
        $('quickErgebnis').hidden = false;
      });
      $('quickNochmal').addEventListener('click', neu);
      const ausblenden = () => { rechnung++; box.hidden = true; };
      $('quickAus').addEventListener('click', ausblenden);
      $('quickWeg').addEventListener('click', ausblenden);
      // Zurück auf die Startseite (aus dem Zwischenspeicher des Browsers):
      // ausgeblendet gilt nur für einen Besuch.
      window.addEventListener('pageshow', (e) => { if (e.persisted && box.hidden) { box.hidden = false; neu(); } });
      box.hidden = false;
      neu();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function (error) {
          console.error('Service Worker konnte nicht registriert werden.', error);
        });
      });
    }
  </script>
</body>
</html>
