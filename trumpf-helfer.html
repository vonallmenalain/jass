<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e13" />
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta property="og:site_name" content="Jass" />
  <meta property="og:title" content="Trumpf-Helfer" />
  <meta property="og:image" content="https://jass.alae.app/icons/teilen.png" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="600" />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="app.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="jass-design.css" />
  <script src="jass-design.js"></script>
  <title>Trumpf-Helfer</title>
  <link rel="stylesheet" href="jass-ui.css" />
  <style>
    .auswahl { display: flex; flex-direction: column; gap: 8px; }
    .farb-reihe { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
    .farb-reihe button { padding: 0; border: none; background: none; border-radius: 7px; transition: transform .1s ease, opacity .15s ease; }
    .farb-reihe button .karte-svg { width: 100%; display: block; }
    .farb-reihe button.gewaehlt { transform: translateY(-4px); }
    .farb-reihe button.gewaehlt .karte-svg { filter: drop-shadow(0 0 6px rgba(253, 224, 71, .95)); }
    .farb-reihe button:disabled { opacity: .35; }
    .meine-hand {
      background: radial-gradient(ellipse at center, #252832 0%, #15171d 60%, #0c0d11 100%);
      border-radius: 20px; padding: 10px; border: 1px solid rgba(255,255,255,0.12);
      display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; min-height: 80px;
    }
    .meine-hand .leer { border: 2px dashed rgba(255,255,255,.25); border-radius: 8px; aspect-ratio: 100 / 140; }
    .meine-hand button { padding: 0; border: none; background: none; }
    .meine-hand .karte-svg { width: 100%; display: block; }
    .foto { width: 100%; height: auto; display: block; border-radius: 14px; background: #000; }
    .meine-hand button { position: relative; }
    .meine-hand button.unsicher .karte-svg { outline: 3px dashed #fbbf24; outline-offset: 1px; border-radius: 7px; }
    .meine-hand button.unsicher::after { content: '?'; position: absolute; top: -7px; right: -5px; width: 18px; height: 18px; border-radius: 50%;
      background: #fbbf24; color: #111827; font: 800 12px/18px system-ui, sans-serif; text-align: center; }
    .foto-status { display: flex; align-items: center; gap: 10px; }
    .kreisel { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: dreh 0.8s linear infinite; flex-shrink: 0; }
    @keyframes dreh { to { transform: rotate(360deg); } }
    .ergebnis-liste { display: flex; flex-direction: column; gap: 6px; }
    .vergleich { border-radius: 16px; padding: 12px 14px; background: rgba(74, 222, 128, .08); border: 1px solid rgba(74, 222, 128, .35); display: flex; flex-direction: column; gap: 6px; }
    .vergleich.unter { background: rgba(248, 113, 113, .08); border-color: rgba(248, 113, 113, .4); }
    .vergleich .gross { font-size: 18px; font-weight: 800; }
    .vergleich .gross b { color: #ff9d96; }
    .ergebnis-zeile { display: grid; grid-template-columns: 128px 1fr 48px; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; font-size: 14px; }
    .ergebnis-zeile.beste { background: rgba(74, 222, 128, .1); }
    .ergebnis-zeile .name { font-weight: 800; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
    .ergebnis-zeile .name .farbzeichen { background: #fffdf8; border-radius: 6px; padding: 2px; width: 22px; height: 22px; flex-shrink: 0; }
    .ergebnis-zeile .name .ohne { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: #fffdf8; color: #111827; font-size: 13px; flex-shrink: 0; }
    .ergebnis-zeile .bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .ergebnis-zeile .bar span { display: block; height: 100%; border-radius: 6px; background: #64748b; }
    .ergebnis-zeile.beste .bar span { background: #4ade80; }
    .ergebnis-zeile .wert { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .empfehlung { font-size: 22px; font-weight: 900; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .empfehlung .farbzeichen { width: 26px; height: 26px; background: #fffdf8; border-radius: 8px; padding: 3px; }
    .balken-leer { width: 100%; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .balken-voll { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  </style>
</head>
<body>
  <div class="app" style="--max: 720px">
    <div class="topbar">
      <a class="icon-btn" href="training.html" aria-label="Zurück">←</a>
      <div class="topbar-titel"><span class="eyebrow">Jass lernen</span><h1>Trumpf-Helfer</h1></div>
      <button class="icon-btn" type="button" id="einstellungenBtn" aria-label="Einstellungen">⚙</button>
    </div>

    <div class="panel stack">
      <div class="reihe" style="justify-content:space-between">
        <h2 id="zaehler">Deine Karten: 0 von 9</h2>
        <div class="reihe">
          <button class="btn-ghost btn-klein" type="button" id="zufall">🎲 Zufall</button>
          <label class="btn-ghost btn-klein" style="cursor:pointer">📷 Foto<input type="file" accept="image/*" capture="environment" id="kamera" hidden></label>
          <button class="btn-ghost btn-klein" type="button" id="leeren">Leeren</button>
        </div>
      </div>
      <div class="meine-hand" id="hand"></div>
      <div class="segmente" id="lage">
        <button type="button" data-lage="vorhand" class="aktiv">Ich sage an (darf schieben)</button>
        <button type="button" data-lage="geschoben">Partner hat geschoben</button>
      </div>
    </div>

    <div class="panel stack" id="fotoPanel" hidden>
      <canvas class="foto" id="foto" role="img" aria-label="Foto deiner Karten"></canvas>
      <div id="fotoText"></div>
    </div>

    <div class="panel stack" id="ergebnis" hidden></div>

    <div class="panel stack">
      <h3>Karten antippen</h3>
      <div class="auswahl" id="auswahl"></div>
    </div>
  </div>

  <div class="dialog-hinten" id="dialog"><div class="dialog" id="dialogInhalt" role="dialog" aria-modal="true"></div></div>

  <script src="jass-engine.js"></script>
  <script src="jass-bot.js"></script>
  <script src="jass-karten.js"></script>
  <script src="jass-einstellungen.js"></script>
  <script src="jass-sprechtexte.js"></script>
  <script src="jass-stimme-dateien.js"></script>
  <script src="jass-stimme.js"></script>
  <script src="jass-vorlesen.js"></script>
  <script src="jass-erkennung.js"></script>
  <script>
  (function () {
    'use strict';
    const J = window.JassEngine;
    const B = window.JassBot;
    const K = window.JassKarten;
    const E = window.JassEinstellungen;
    const S = window.JassSprechtexte;
    const $ = (id) => document.getElementById(id);
    let anzeige = E.ladeAnzeige();
    K.setzeFarben(anzeige.farben);
    let regeln = E.ladeRegeln();

    const KEY = 'jass-lernen-helfer-v1';
    const gemerkt = E.lese(KEY) || {};
    let hand = Array.isArray(gemerkt.hand) ? gemerkt.hand.filter((k) => k >= 0 && k < 36).slice(0, 9) : [];
    let lage = gemerkt.lage === 'geschoben' ? 'geschoben' : 'vorhand';
    let rechnung = 0;
    const merke = () => E.schreibe(KEY, { hand, lage });
    // Die zuletzt errechnete Liste – beim Zurückkommen vom Ausspielen nicht
    // neu rechnen, damit der Vergleich zum selben Schnitt passt.
    const gleicheHand = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length && a.slice().sort().join() === b.slice().sort().join();
    let gemerkteListe = gleicheHand(gemerkt.hand, hand) && Array.isArray(gemerkt.werte) && gemerkt.lage === lage
      ? gemerkt.werte.map((w) => ({ code: w.c, punkte: w.p, n: gemerkt.n })) : null;

    // Zurück vom Ausspielen: was herauskam, für den Vergleich.
    let ausgespielt = null;
    if (new URLSearchParams(location.search).has('ausgespielt')) {
      const e = E.lese('jass-helfer-ergebnis');
      try { localStorage.removeItem('jass-helfer-ergebnis'); } catch (x) { /* egal */ }
      history.replaceState(null, '', location.pathname);
      if (e && gleicheHand(e.hand, hand)) ausgespielt = e;
    }

    // Reihen der Auswahl: Farben abwechselnd schwarz/rot, Ass links.
    function zeichneAuswahl() {
      const voll = hand.length >= 9;
      $('auswahl').innerHTML = [0, 1, 2, 3].map((f) => `<div class="farb-reihe">${[8, 7, 6, 5, 4, 3, 2, 1, 0].map((w) => {
        const k = J.karte(f, w);
        const drin = hand.includes(k);
        return `<button type="button" data-karte="${k}" class="${drin ? 'gewaehlt' : ''}" ${voll && !drin ? 'disabled' : ''} aria-pressed="${drin}" aria-label="${J.kartenName(k)}">${K.svg(k)}</button>`;
      }).join('')}</div>`).join('');
    }

    // Karten, die die Erkennung nur unsicher gefunden hat (gelber Rand).
    let unsicher = new Set();

    function zeichneHand() {
      const sortiert = J.sortiereHand(hand, null);
      unsicher = new Set([...unsicher].filter((k) => hand.includes(k)));
      $('hand').innerHTML = sortiert.map((k) => `<button type="button" data-weg="${k}" class="${unsicher.has(k) ? 'unsicher' : ''}" aria-label="${J.kartenName(k)}${unsicher.has(k) ? ' (unsicher erkannt)' : ''} entfernen">${K.svg(k)}</button>`).join('') + '<div class="leer"></div>'.repeat(9 - hand.length);
      $('zaehler').textContent = 'Deine Karten: ' + hand.length + ' von 9';
      $('lage').querySelectorAll('button').forEach((b) => b.classList.toggle('aktiv', b.dataset.lage === lage));
      $('lage').hidden = !regeln.schieben;
    }

    function alles() {
      zeichneHand();
      zeichneAuswahl();
      if (hand.length === 9 && gemerkteListe) {
        rechnung++;
        zeigeErgebnis(gemerkteListe);
        gemerkteListe = null;
        return;
      }
      ausgespielt = null;
      merke();
      if (hand.length === 9) rechne(); else { rechnung++; $('ergebnis').hidden = true; }
    }

    $('auswahl').addEventListener('click', (e) => {
      const b = e.target.closest('[data-karte]');
      if (!b || b.disabled) return;
      const k = Number(b.dataset.karte);
      hand = hand.includes(k) ? hand.filter((x) => x !== k) : hand.concat(k);
      alles();
    });
    $('hand').addEventListener('click', (e) => {
      const b = e.target.closest('[data-weg]');
      if (!b) return;
      hand = hand.filter((x) => x !== Number(b.dataset.weg));
      alles();
    });
    $('leeren').addEventListener('click', () => { hand = []; alles(); });
    // Neun zufällige Karten – und gleich ausrechnen, was man ansagen sollte.
    $('zufall').addEventListener('click', () => {
      hand = J.mische(Array.from({ length: 36 }, (_, k) => k), Math.random).slice(0, 9);
      alles();
      $('ergebnis').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    $('lage').addEventListener('click', (e) => {
      const b = e.target.closest('[data-lage]');
      if (!b) return;
      lage = b.dataset.lage;
      alles();
    });

    function modusHtml(code) {
      if (code === 'SCHIEBEN') return '<span class="ohne">↔</span><span>Schieben</span>';
      const m = J.MODI[code];
      return (m.trumpf >= 0 ? K.zeichen(m.trumpf) : `<span class="ohne">${m.symbol}</span>`) + `<span>${m.name}</span>`;
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Spielt die Hand mit vielen Verteilungen der anderen Karten durch.
    function rechne() {
      const id = ++rechnung;
      const geschoben = lage === 'geschoben' || !regeln.schieben;
      const b = B.bewertung(hand, regeln, { geschoben });
      const ziel = Math.max(200, B.rechentiefe(anzeige.rechnen).ansage * 4);
      const box = $('ergebnis');
      box.hidden = false;
      box.innerHTML = '<p class="muted">Ich spiele deine Karten durch …</p><div class="balken-leer"><div class="balken-voll" id="balken"></div></div>';
      const schritt = () => {
        if (id !== rechnung) return;
        const t0 = performance.now();
        while (b.gemacht < ziel && performance.now() - t0 < 30) b.schritt(5);
        const balken = $('balken');
        if (balken) balken.style.width = Math.round((100 * b.gemacht) / ziel) + '%';
        if (b.gemacht < ziel) { setTimeout(schritt, 0); return; }
        zeigeErgebnis(b.ergebnis());
      };
      setTimeout(schritt, 20);
    }

    // Was beim Ausspielen herauskam, neben dem errechneten Schnitt.
    function vergleichHtml(liste) {
      const e = ausgespielt;
      if (!e) return '';
      const name = (c) => (c === 'SCHIEBEN' ? 'Schieben' : J.MODI[c].lang);
      const ichSchob = e.geschoben && e.vorhand === 0;
      const eintrag = liste.find((x) => x.code === (ichSchob ? 'SCHIEBEN' : e.code));
      const erwartet = eintrag ? eintrag.punkte : null;
      const diff = erwartet == null ? 0 : e.punkte - erwartet;
      let satz = '';
      if (erwartet != null) {
        if (diff >= 10) satz = Math.round(diff) + ' Punkte über dem Schnitt – stark gespielt, oder die anderen Karten lagen gut für euch.';
        else if (diff <= -10) satz = Math.round(-diff) + ' Punkte unter dem Schnitt – die Karten der anderen lagen gegen euch, oder es gab bessere Züge.';
        else satz = 'Ziemlich genau im Schnitt.';
      }
      const wie = ichSchob ? 'Du hast geschoben, angesagt wurde <b>' + name(e.code) + '</b>' : 'Angesagt: <b>' + name(e.code) + '</b>';
      const sprechen = S.vergleich({ punkte: e.punkte, code: e.code, ichSchob }, erwartet, null);
      return `<div class="vergleich ${diff <= -10 ? 'unter' : ''}" data-vorlesen data-sprechen="${esc(JSON.stringify(sprechen))}">
        <h3>Ausgespielt</h3>
        <div class="gross">Ihr habt <b>${e.punkte}</b> Punkte gemacht.</div>
        <p class="muted">${wie}. Im Schnitt wären es ${erwartet == null ? '–' : Math.round(erwartet)} gewesen. ${satz}</p>
        ${e.partieId ? `<a class="btn-ghost btn-klein" href="verlauf.html?p=${encodeURIComponent(e.partieId)}&amp;von=helfer" style="align-self:flex-start">📜 Gespielte Runde</a>` : ''}
      </div>`;
    }

    function zeigeErgebnis(liste) {
      E.schreibe(KEY, { hand, lage, werte: liste.map((x) => ({ c: x.code, p: Math.round(x.punkte * 10) / 10 })), n: liste[0].n });
      const beste = liste[0];
      const max = Math.max(...liste.map((x) => x.punkte));
      const min = Math.min(0, ...liste.map((x) => x.punkte));
      const name = (c) => (c === 'SCHIEBEN' ? 'Schieben' : J.MODI[c].lang);
      const heuristik = B.heuristikAnsage(hand, regeln, lage !== 'geschoben' && regeln.schieben);
      $('ergebnis').hidden = false;
      $('ergebnis').innerHTML = `
        ${vergleichHtml(liste)}
        <div class="stack" style="gap:6px;align-items:center" data-vorlesen data-sprechen="${esc(JSON.stringify(S.helferVorschlag(hand, liste, !!regeln.multiplikatoren, heuristik.code)))}">
          <span class="muted klein" style="text-align:center">Mein Vorschlag</span>
          <div class="empfehlung">${modusHtml(beste.code)}</div>
          <p class="muted" style="text-align:center">${esc(B.faustregel(hand, beste.code))}</p>
        </div>
        <div class="ergebnis-liste">${liste.map((x) => `<div class="ergebnis-zeile ${x === beste ? 'beste' : ''}">
          <span class="name">${modusHtml(x.code)}</span>
          <span class="bar"><span style="width:${Math.max(3, Math.round((100 * (x.punkte - min)) / Math.max(1, max - min)))}%"></span></span>
          <span class="wert">${Math.round(x.punkte)}</span></div>`).join('')}</div>
        <a class="btn-ghost btn-voll" href="jass-spiel.html?hand=${hand.join('.')}${lage === 'geschoben' && regeln.schieben ? '&amp;geschoben=1' : ''}&amp;trainer=1&amp;zurueck=helfer">${ausgespielt ? 'Nochmals eine Runde' : 'Mit diesen Karten eine Runde'} spielen</a>`;
    }

    // Foto der Hand: Karten erkennen (jass-erkennung.js), vorwählen, rechnen.
    // Was unsicher ist, bekommt einen gelben Rand; korrigiert wird wie immer
    // durch Antippen.
    const R = window.JassErkennung;
    let fotoNr = 0;
    function fotoText(saetze, laden) {
      const text = saetze.map(esc).join(' ');
      $('fotoText').innerHTML = laden
        ? `<div class="foto-status"><span class="kreisel"></span><p class="muted klein">${text}</p></div>`
        : `<p class="muted klein" data-vorlesen data-sprechen="${esc(JSON.stringify(saetze))}">${text}</p>`;
    }
    // Foto zeichnen, mit den Fundstellen der erkannten Karten.
    function zeichneFoto(bild, karten) {
      const c = $('foto');
      const bw = bild.naturalWidth || bild.width, bh = bild.naturalHeight || bild.height;
      const s = Math.min(1, 1100 / Math.max(bw, bh));
      c.width = Math.round(bw * s); c.height = Math.round(bh * s);
      const ctx = c.getContext('2d');
      ctx.drawImage(bild, 0, 0, c.width, c.height);
      const r = Math.max(14, c.width / 28);
      ctx.font = `800 ${Math.round(r * 0.9)}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const k of karten || []) {
        const x = k.x * c.width, y = k.y * c.height;
        const name = J.kurzName(k.karte);
        const breit = Math.max(r * 2.2, ctx.measureText(name).width + r);
        ctx.fillStyle = k.wert >= R.SICHER ? 'rgba(15, 23, 42, .85)' : 'rgba(251, 191, 36, .95)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x - breit / 2, y - r * 0.75, breit, r * 1.5, r * 0.5); else ctx.rect(x - breit / 2, y - r * 0.75, breit, r * 1.5);
        ctx.fill();
        ctx.fillStyle = k.wert >= R.SICHER ? '#fff' : '#111827';
        ctx.fillText(name, x, y + 1);
      }
    }
    // Schon beim Antippen von «Foto» die Erkennung laden (beim ersten Mal ein paar MB).
    $('kamera').closest('label').addEventListener('pointerdown', () => R.vorladen());
    $('kamera').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      const nr = ++fotoNr;
      const bild = new Image();
      bild.src = URL.createObjectURL(f);
      try { await bild.decode(); } catch (x) { /* zeigt dann kein Bild */ }
      if (nr !== fotoNr) return;
      $('fotoPanel').hidden = false;
      zeichneFoto(bild, []);
      fotoText([S.FOTO_LADEN], true);
      $('fotoPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      try {
        const r = await R.erkenne(f);
        if (nr !== fotoNr) return;
        zeichneFoto(bild, r.karten);
        hand = r.karten.map((k) => k.karte);
        unsicher = new Set(r.karten.filter((k) => k.wert < R.SICHER).map((k) => k.karte));
        gemerkteListe = null;
        alles();
        fotoText(S.fotoErkannt(unsicher.size > 0), false);
      } catch (x) {
        if (nr !== fotoNr) return;
        console.warn(x);
        fotoText([S.FOTO_FEHLER], false);
      }
    });

    $('einstellungenBtn').addEventListener('click', () => {
      $('dialogInhalt').innerHTML = `<h2>Einstellungen</h2><div class="stack" id="setRegeln" style="gap:10px"></div><div id="setAnzeige"></div>
        <button class="btn btn-voll" type="button" id="dialogOk">Fertig</button>`;
      $('dialog').classList.add('offen');
      E.regelFormular($('setRegeln'), regeln, (r) => E.speichereRegeln(r), { laenge: false, offen: ['modi'] });
      E.anzeigeFormular($('setAnzeige'), anzeige, (a) => { E.speichereAnzeige(a); K.setzeFarben(a.farben); }, { spiel: false, tempo: false });
      $('dialogOk').addEventListener('click', () => { $('dialog').classList.remove('offen'); alles(); });
    });
    $('dialog').addEventListener('click', (e) => { if (e.target === $('dialog')) $('dialogOk').click(); });

    alles();
  })();
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(function () {});
  </script>
</body>
</html>
